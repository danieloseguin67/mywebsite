<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f0fdf4"/>
  <rect width="800" height="70" fill="#166534"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Smart Grocery &amp; Pantry</text>
  <text x="580" y="44" font-family="Arial, sans-serif" font-size="15" fill="#bbf7d0">My List</text>
  <text x="660" y="44" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Pantry</text>

  <!-- App Header -->
  <rect x="40" y="100" width="720" height="120" rx="12" fill="#22c55e"/>
  <text x="70" y="150" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Interactive Shopping List &amp; Inventory</text>
  <text x="70" y="180" font-family="Arial, sans-serif" font-size="15" fill="#f0fdf4">Organize items by category, track inventory &amp; budget smartly.</text>

  <!-- Grocery Items List -->
  <rect x="40" y="240" width="720" height="320" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>

  <rect x="70" y="270" width="660" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="302" font-family="Arial, sans-serif" font-size="20">🥦</text>
  <text x="135" y="302" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Fresh Organic Vegetables</text>
  <rect x="630" y="280" width="80" height="30" rx="15" fill="#dcfce7"/>
  <text x="670" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">In Stock</text>

  <rect x="70" y="335" width="660" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="367" font-family="Arial, sans-serif" font-size="20">🍎</text>
  <text x="135" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Apples &amp; Fresh Fruits</text>
  <rect x="630" y="345" width="80" height="30" rx="15" fill="#fef9c3"/>
  <text x="670" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#a16207" text-anchor="middle">Low Stock</text>

  <rect x="70" y="400" width="660" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="432" font-family="Arial, sans-serif" font-size="20">🥛</text>
  <text x="135" y="432" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Dairy &amp; Oat Milk</text>
  <rect x="630" y="410" width="80" height="30" rx="15" fill="#dcfce7"/>
  <text x="670" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">In Stock</text>

  <rect x="70" y="465" width="660" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="497" font-family="Arial, sans-serif" font-size="20">🥖</text>
  <text x="135" y="497" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Whole Grain Bakery Bread</text>
  <rect x="630" y="475" width="80" height="30" rx="15" fill="#fee2e2"/>
  <text x="670" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">To Buy</text>
</svg>