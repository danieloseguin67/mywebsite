<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#fdf8f6"/>
  <rect width="800" height="70" fill="#4a5568"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Roxane Bélanger</text>
  <text x="230" y="45" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">Orthophoniste / Speech-Language Pathologist</text>
  <text x="620" y="44" font-family="Arial, sans-serif" font-size="15" fill="#fbd38d">Accueil</text>
  <text x="700" y="44" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Contact</text>

  <!-- Hero Section -->
  <rect x="40" y="100" width="720" height="200" rx="16" fill="#e2e8f0"/>
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2d3748">Services d'Orthophonie Clinique</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">Évaluation, accompagnement et suivi personnalisé pour enfants et adultes.</text>
  <rect x="80" y="220" width="180" height="40" rx="20" fill="#dd6b20"/>
  <text x="170" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Prendre Rendez-vous</text>

  <!-- Services Grid -->
  <rect x="40" y="330" width="220" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="380" font-family="Arial, sans-serif" font-size="36" fill="#dd6b20">🗣️</text>
  <text x="70" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">Langage &amp; Parole</text>
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="13" fill="#718096">Évaluation et réadaptation des troubles du langage.</text>

  <rect x="290" y="330" width="220" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="380" font-family="Arial, sans-serif" font-size="36" fill="#dd6b20">📚</text>
  <text x="320" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">Apprentissage</text>
  <text x="320" y="450" font-family="Arial, sans-serif" font-size="13" fill="#718096">Soutien pour la lecture, l'écriture et la communication.</text>

  <rect x="540" y="330" width="220" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="570" y="380" font-family="Arial, sans-serif" font-size="36" fill="#dd6b20">🩺</text>
  <text x="570" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">Suivi Clinique</text>
  <text x="570" y="450" font-family="Arial, sans-serif" font-size="13" fill="#718096">Accompagnement adapté pour familles et intervenants.</text>
