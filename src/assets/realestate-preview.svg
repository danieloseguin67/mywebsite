<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f1f5f9"/>
  <rect width="800" height="70" fill="#0f172a"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">Real Estate WebCompanion</text>
  <text x="450" y="44" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">Listings</text>
  <text x="540" y="44" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8">Search</text>
  <text x="630" y="44" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8">Contact</text>

  <!-- Hero Search -->
  <rect x="40" y="90" width="720" height="140" rx="12" fill="#1e293b"/>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Find Your Dream Property</text>
  <text x="70" y="170" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1">Explore curated real estate listings &amp; companion tools</text>
  <rect x="70" y="185" width="400" height="35" rx="6" fill="#ffffff"/>
  <text x="85" y="208" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Search location, price, or property type...</text>

  <!-- Property Grid -->
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Featured Listings</text>

  <!-- Card 1 -->
  <rect x="40" y="285" width="220" height="270" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="40" y="285" width="220" height="130" rx="10" fill="#38bdf8"/>
  <text x="150" y="355" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle">🏠</text>
  <text x="55" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">$649,000</text>
  <text x="55" y="462" font-family="Arial, sans-serif" font-size="13" fill="#64748b">3 Bed • 2 Bath • Condo</text>
  <text x="55" y="482" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Downtown Sector</text>

  <!-- Card 2 -->
  <rect x="290" y="285" width="220" height="270" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="290" y="285" width="220" height="130" rx="10" fill="#0284c7"/>
  <text x="400" y="355" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle">🏢</text>
  <text x="305" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">$820,000</text>
  <text x="305" y="462" font-family="Arial, sans-serif" font-size="13" fill="#64748b">4 Bed • 3 Bath • House</text>
  <text x="305" y="482" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Suburban Waterfront</text>

  <!-- Card 3 -->
  <rect x="540" y="285" width="220" height="270" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="540" y="285" width="220" height="130" rx="10" fill="#0f766e"/>
  <text x="650" y="355" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle">🏡</text>
  <text x="555" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">$495,000</text>
  <text x="555" y="462" font-family="Arial, sans-serif" font-size="13" fill="#64748b">2 Bed • 1 Bath • Loft</text>
  <text x="555" y="482" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Old Port District</text>
</svg>